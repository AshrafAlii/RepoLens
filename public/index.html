<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepoLens</title>

  <link rel="icon" type="image/svg+xml" href="logo.svg?v=3" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>

<!-- ── Login overlay ─────────────────────────────────────── -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">
      <img class="login-logo-img" src="logo.svg?v=3" alt="" width="44" height="44" />
      <div class="login-brand">RepoLens</div>
      <div class="login-sub">Private media vault</div>
    </div>
    <label class="login-label" for="loginPass">Password</label>
    <div class="login-field">
      <input class="login-input" id="loginPass" type="password" placeholder="Enter password" autocomplete="current-password" />
      <button class="login-eye" id="loginEye" type="button" aria-label="Show password" aria-pressed="false" title="Show password">
        <svg class="eye-open" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg class="eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
          <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6.5 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
          <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3.5 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
      </button>
    </div>
    <button class="login-btn" id="loginBtn" onclick="submitLogin()">Unlock</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ══ App shell ═════════════════════════════════════════════ -->
<div class="app" id="app">

  <!-- Top bar -->
  <header class="appbar">
    <div class="brand">
      <img class="logo-mark" src="logo.svg?v=3" alt="" width="30" height="30" />
      <span class="brand-name">RepoLens</span>
    </div>

    <div class="search" role="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7.5"/><line x1="20.5" y1="20.5" x2="16.2" y2="16.2"/>
      </svg>
      <input class="search-input" id="searchInput" type="search" placeholder="Search files by name…" autocomplete="off" spellcheck="false" aria-label="Search files" />
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <span class="search-kbd" aria-hidden="true">⌘ F</span>
    </div>

    <div class="appbar-actions">
      <button class="btn-new" id="newBtn" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New
      </button>
      <button class="icon-btn" type="button" onclick="loadAll()" title="Refresh" aria-label="Refresh">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <div class="account">
        <button class="avatar" id="accountBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Account">A</button>
        <div class="account-menu" id="accountMenu" hidden>
          <div class="account-head">Signed in</div>
          <div class="account-name">Ashraf</div>
          <button class="account-item" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <div class="app-body">

    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="nav" aria-label="Library">
        <button class="nav-item active" data-tab="all" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>
          </svg>
          <span class="nav-label">All files</span>
          <span class="nav-count" id="dt-cnt-all">0</span>
        </button>
        <button class="nav-item" data-tab="image" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
          <span class="nav-label">Photos</span>
          <span class="nav-count" id="dt-cnt-image">0</span>
        </button>
        <button class="nav-item" data-tab="video" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3"/><polygon points="10 9 15 12 10 15 10 9"/>
          </svg>
          <span class="nav-label">Videos</span>
          <span class="nav-count" id="dt-cnt-video">0</span>
        </button>
        <button class="nav-item" data-tab="pdf" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/>
          </svg>
          <span class="nav-label">Documents</span>
          <span class="nav-count" id="dt-cnt-pdf">0</span>
        </button>
      </nav>

      <div class="nav-sep"></div>

      <button class="nav-item nav-item-sub" id="thumbBtn" type="button" onclick="backfillThumbs()" style="display:none;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
        </svg>
        <span class="nav-label">Optimize</span>
      </button>

      <div class="sidebar-foot">
        <div class="storage">
          <div class="storage-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.5 19a4.5 4.5 0 0 0 .4-9A6.5 6.5 0 0 0 5.5 8.4 4.8 4.8 0 0 0 6 19z"/>
            </svg>
            <span>Storage</span>
          </div>
          <div class="storage-track"><div class="storage-fill" id="storageFill"></div></div>
          <div class="storage-meta"><span id="storageUsed">—</span> of 1 GB used</div>
        </div>
        <div class="credit">Crafted by <span>Ashraf</span></div>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Mobile category pills -->
      <div class="mob-tabs" id="mobTabs">
        <button class="tab active" data-tab="all" type="button">All <span class="tab-count" id="mob-cnt-all">0</span></button>
        <button class="tab" data-tab="image" type="button">Photos <span class="tab-count" id="mob-cnt-image">0</span></button>
        <button class="tab" data-tab="video" type="button">Videos <span class="tab-count" id="mob-cnt-video">0</span></button>
        <button class="tab" data-tab="pdf" type="button">Documents <span class="tab-count" id="mob-cnt-pdf">0</span></button>
      </div>

      <!-- Notice bar -->
      <div class="notice" id="noticeBar" hidden>
        <p class="notice-text" id="noticeText"></p>
        <button class="notice-close" id="noticeClose" type="button" aria-label="Dismiss">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="content-head">
        <div class="content-heading">
          <h1 class="content-title" id="contentTitle">All files</h1>
          <p class="content-sub" id="pageSub">Loading media…</p>
        </div>

        <div class="content-actions">
          <div class="sort" id="sortWrap">
            <button class="select-btn sort-btn" id="sortBtn" type="button" aria-haspopup="menu" aria-expanded="false" title="Sort files">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <line x1="21" y1="6" x2="14" y2="6"/><line x1="10" y1="6" x2="3" y2="6"/>
                <line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="18" x2="16" y2="18"/><line x1="12" y1="18" x2="3" y2="18"/>
                <line x1="14" y1="3" x2="14" y2="9"/><line x1="8" y1="9" x2="8" y2="15"/><line x1="16" y1="15" x2="16" y2="21"/>
              </svg>
              <span id="sortLabel">Name A–Z</span>
              <svg class="sort-caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>

            <div class="sort-menu" id="sortMenu" role="menu" aria-label="Sort files" hidden>
              <button class="sort-option active" data-sort="name-asc" type="button" role="menuitemradio" aria-checked="true">
                <span>Name (A–Z)</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button class="sort-option" data-sort="name-desc" type="button" role="menuitemradio" aria-checked="false">
                <span>Name (Z–A)</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <div class="sort-divider"></div>
              <button class="sort-option" data-sort="date-desc" type="button" role="menuitemradio" aria-checked="false">
                <span>Newest first</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
              <button class="sort-option" data-sort="date-asc" type="button" role="menuitemradio" aria-checked="false">
                <span>Oldest first</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
          </div>

          <button class="select-btn" id="selectModeBtn" type="button" onclick="toggleSelectMode()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
              <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span>Select</span>
          </button>
        </div>
      </div>

      <div class="content" id="contentArea"></div>
    </main>

  </div>
</div>

<!-- Hidden upload input -->
<input type="file" id="fileInput" accept="image/*,video/*,.pdf" multiple hidden />

<!-- Floating upload progress -->
<div class="upload-pill" id="uploadPill">
  <div class="up-top">
    <div class="up-icon-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
      </svg>
    </div>
    <div class="up-info">
      <div class="up-filename" id="upFilename">Uploading…</div>
      <div class="up-status" id="upStatus">Preparing…</div>
    </div>
    <div class="up-pct" id="upPct">0%</div>
  </div>
  <div class="up-track"><div class="up-fill" id="upFill"></div></div>
</div>

<!-- Bulk selection bar -->
<div class="bulk-bar" id="bulkBar">
  <div class="bulk-info">
    <span class="bulk-count" id="bulkCount">0 selected</span>
    <button class="bulk-select-all" id="bulkSelectAll" type="button">Select all</button>
  </div>
  <div class="bulk-actions">
    <button class="bulk-cancel" type="button" onclick="toggleSelectMode()">Cancel</button>
    <button class="bulk-delete" id="bulkDeleteBtn" type="button" onclick="bulkDelete()" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      Delete
    </button>
  </div>
</div>

<!-- Preview Modal -->
<div class="modal" id="modal">
  <div class="modal-bar">
    <span class="modal-fname" id="modalFname"></span>
    <div class="modal-acts">
      <span class="modal-counter" id="modalCounter"></span>
      <button class="mbtn download" id="modalDownload" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Download</span>
      </button>
      <button class="mbtn del" id="modalDel" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
        <span>Delete</span>
      </button>
      <button class="mbtn" id="modalClose" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        <span>Close</span>
      </button>
    </div>
  </div>
  <div class="modal-media" id="modalMedia"></div>
  <button class="modal-nav prev" id="modalPrev" type="button" aria-label="Previous">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
  <button class="modal-nav next" id="modalNext" type="button" aria-label="Next">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>
</div>

<!-- Confirm delete -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">Delete file?</div>
    <p class="confirm-desc">
      <span class="confirm-fname" id="cFname"></span> will be permanently removed from your GitHub repository.
    </p>
    <div class="confirm-btns">
      <button class="c-cancel" id="cCancel" type="button">Cancel</button>
      <button class="c-del" id="cConfirm" type="button">Delete</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- PDF Preview Modal -->
<div class="pdf-modal" id="pdfModal">
  <div class="pdf-modal-bar">
    <div class="pdf-modal-left">
      <div class="pdf-modal-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pdf)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <span class="pdf-modal-fname" id="pdfModalFname"></span>
    </div>
    <div class="pdf-modal-acts">
      <button class="mbtn download" id="pdfModalDownload" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Download</span>
      </button>
      <button class="mbtn del" id="pdfModalDel" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
        <span>Delete</span>
      </button>
      <button class="mbtn" id="pdfModalClose" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        <span>Close</span>
      </button>
    </div>
  </div>
  <div class="pdf-modal-body" id="pdfModalBody">
    <div class="pdf-loading" id="pdfLoading">
      <div class="pdf-loading-spinner"></div>
      <span>Loading PDF…</span>
    </div>
    <iframe id="pdfFrame" class="pdf-frame" title="PDF Preview"></iframe>
  </div>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
